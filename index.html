<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overwatch Tier Lists</title>
  <meta
    name="description"
    content="Aktuelle Overwatch Tier Lists für Tank, DPS und Support sowie schnelle Links zu Perks- und Stadium-Ressourcen."
  />
  <link rel="icon" type="image/png" href="assets/images/ui/favicon.png" />
  <link rel="stylesheet" href="assets/styles/main.css" />
</head>
<body>
  <header class="hero">
    <h1 class="main-title">Overwatch Tier Lists</h1>
  </header>

  <main class="grid" aria-label="Overwatch Tier Lists">
    <a class="tier-list-item" href="#img1">
      <div class="tier-list-copy">
        <h2>TANK</h2>
      </div>
      <div class="tier-list-image-wrapper">
        <img
          src="assets/images/tierlists/tanks.png"
          alt="Tank Tier List Vorschau"
          loading="eager"
          decoding="async"
          width="1280"
          height="720"
        />
      </div>
    </a>

    <a class="tier-list-item" href="#img2">
      <div class="tier-list-copy">
        <h2>DPS</h2>
      </div>
      <div class="tier-list-image-wrapper">
        <img
          src="assets/images/tierlists/dps.png"
          alt="DPS Tier List Vorschau"
          loading="eager"
          decoding="async"
          width="1280"
          height="720"
        />
      </div>
    </a>

    <a class="tier-list-item" href="#img3">
      <div class="tier-list-copy">
        <h2>SUPPORT</h2>
      </div>
      <div class="tier-list-image-wrapper">
        <img
          src="assets/images/tierlists/support.png"
          alt="Support Tier List Vorschau"
          loading="eager"
          decoding="async"
          width="1280"
          height="720"
        />
      </div>
    </a>
  </main>

  <section class="resources-section" aria-label="Externe Ressourcen">
    <div class="resource-card">
      <p class="resource-label">Perks</p>
      <h2>Perk Referenz</h2>
      <a
        href="https://owperks.com/"
        target="_blank"
        rel="noopener noreferrer"
        class="resource-button"
      >
        owperks.com
      </a>
    </div>

    <div class="resource-card">
      <p class="resource-label">Stadium</p>
      <h2>Build Finder</h2>
      <a
        href="https://stadiumbuilds.io/"
        target="_blank"
        rel="noopener noreferrer"
        class="resource-button"
      >
        stadiumbuilds.io
      </a>
    </div>
  </section>

  <div id="img1" class="lightbox" role="dialog" aria-modal="true" aria-label="Tank Tier List Großansicht">
    <a class="lightbox-close-bg" href="#" aria-label="Hintergrund schließen"></a>
    <a class="close" href="#" aria-label="Schließen">&times;</a>
    <a class="nav-arrow prev" href="#img3" aria-label="Vorheriges Bild">&#10094;</a>
    <a class="nav-arrow next" href="#img2" aria-label="Nächstes Bild">&#10095;</a>
    <img src="assets/images/tierlists/tanks.png" alt="Tank Tier List Großansicht" />
  </div>

  <div id="img2" class="lightbox" role="dialog" aria-modal="true" aria-label="DPS Tier List Großansicht">
    <a class="lightbox-close-bg" href="#" aria-label="Hintergrund schließen"></a>
    <a class="close" href="#" aria-label="Schließen">&times;</a>
    <a class="nav-arrow prev" href="#img1" aria-label="Vorheriges Bild">&#10094;</a>
    <a class="nav-arrow next" href="#img3" aria-label="Nächstes Bild">&#10095;</a>
    <img src="assets/images/tierlists/dps.png" alt="DPS Tier List Großansicht" />
  </div>

  <div id="img3" class="lightbox" role="dialog" aria-modal="true" aria-label="Support Tier List Großansicht">
    <a class="lightbox-close-bg" href="#" aria-label="Hintergrund schließen"></a>
    <a class="close" href="#" aria-label="Schließen">&times;</a>
    <a class="nav-arrow prev" href="#img2" aria-label="Vorheriges Bild">&#10094;</a>
    <a class="nav-arrow next" href="#img1" aria-label="Nächstes Bild">&#10095;</a>
    <img src="assets/images/tierlists/support.png" alt="Support Tier List Großansicht" />
  </div>

  <script src="assets/scripts/main.js"></script>
</body>
</html>
